name: AI Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ai-guard:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install AI Guard
        run: npm install --save-dev eslint-plugin-ai-guard@latest

      - name: Run AI Guard
        run: |
          npx ai-guard changed \
            --pr \
            --fail-on high \
            --sarif \
            --github-summary
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-guard-sarif
          path: ai-guard-results.sarif